[package]
name = "xdd"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
shell-words = "1.1.0"
toml = "1.1.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
