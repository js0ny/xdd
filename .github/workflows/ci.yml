name: CI

on:
  push:
    branches: [master]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate version and tag
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['package']['version']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Release versions must use MAJOR.MINOR.PATCH')
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != version:
              raise SystemExit(f'Tag must equal Cargo.toml version {version}, without a v prefix')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

  checks:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Check formatting
        run: nix develop --command cargo fmt --all -- --check
      - name: Clippy
        run: nix develop --command cargo clippy --offline --all-targets -- -D warnings
      - name: Test
        run: nix develop --command cargo test --offline
      - name: Build native Nix package
        run: nix build .#default --no-link --print-build-logs

  linux:
    needs: metadata
    name: Linux (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build and test static musl package
        run: nix build .#musl --print-build-logs
      - name: Check static linkage
        run: |
          readelf --program-headers result/bin/xdd > "$RUNNER_TEMP/xdd-program-headers"
          readelf --dynamic result/bin/xdd > "$RUNNER_TEMP/xdd-dynamic"
          if grep -q INTERP "$RUNNER_TEMP/xdd-program-headers" || grep -q NEEDED "$RUNNER_TEMP/xdd-dynamic"; then
            echo 'Expected a fully static binary' >&2
            exit 1
          fi
      - name: Smoke test
        run: python3 .github/scripts/smoke-test.py result/bin/xdd
      - name: Package binary
        run: |
          name="xdd-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          install -m755 result/bin/xdd "dist/$name/xdd"
          install -m644 README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xdd-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    needs: metadata
    name: Windows (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test
        run: cargo test --offline
      - name: Clippy
        run: cargo clippy --offline --all-targets -- -D warnings
      - name: Build release binary
        run: cargo build --offline --release
      - name: Package binary and registration script
        run: |
          $name = "xdd-$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item target/release/xdd.exe, README.md, LICENSE, packaging/windows/register.ps1 "dist/$name/"
          Compress-Archive -LiteralPath "dist/$name" -DestinationPath "dist/$name.zip"
      - name: Smoke test packaged binary
        run: |
          $name = "xdd-$env:VERSION-$env:TARGET"
          $unpacked = Join-Path $env:RUNNER_TEMP 'xdd-package'
          Expand-Archive -LiteralPath "dist/$name.zip" -DestinationPath $unpacked
          if (-not (Test-Path "$unpacked/$name/register.ps1")) { throw 'Registration script missing from archive' }
          python .github/scripts/smoke-test.py "$unpacked/$name/xdd.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xdd-${{ env.TARGET }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, checks, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: xdd-*
          merge-multiple: true
          path: dist
      - name: Package source and checksums
        run: |
          test -f "dist/xdd-$VERSION-x86_64-unknown-linux-musl.tar.gz"
          test -f "dist/xdd-$VERSION-aarch64-unknown-linux-musl.tar.gz"
          test -f "dist/xdd-$VERSION-x86_64-pc-windows-msvc.zip"
          git archive --format=tar.gz --prefix="xdd-$VERSION-source/" \
            --output="dist/xdd-$VERSION-source.tar.gz" HEAD
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft=$(gh release view "$VERSION" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != true ]]; then
              echo 'Refusing to replace assets of a published release' >&2
              exit 1
            fi
          else
            gh release create "$VERSION" --verify-tag --draft \
              --title "$VERSION" --generate-notes
          fi
          gh release upload "$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
